on:
  push:
    branches:
      - main
      - master
name: Render and Publish
permissions:
    contents: write
    pages: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          packages: |
            any::knitr
            any::rmarkdown
            any::tidyverse
            any::kableExtra
            any::gt
            
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      # Render the standalone syllabus file to PDF
      - name: Render Syllabus to PDF
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: syllabus_wis2323.qmd
          to: pdf

      # Render the entire book project
      - name: Render Quarto Book Project
        uses: quarto-dev/quarto-actions/render@v2

      # Upload both PDFs as artifacts
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syllabus-pdfs
          path: |
            syllabus_wis2323.pdf
            book/*.pdf

      # Publish the book to GitHub Pages
      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}