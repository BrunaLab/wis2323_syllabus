on:
  push:
    branches:
      - main
      - master
name: Render and Publish
permissions:
    contents: write
    pages: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          packages: |
            any::knitr
            any::rmarkdown
            any::tidyverse
            any::kableExtra
            any::gt
            
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      # Debug: List files to see what's available
      - name: List files in syllabus folder
        run: |
          echo "Checking for syllabus directory:"
          if [ -d "syllabus" ]; then
            echo "Files in syllabus directory:"
            ls -la syllabus/
            echo "Looking for .qmd files in syllabus folder:"
            find syllabus/ -name "*.qmd" -type f
          else
            echo "ERROR: syllabus directory not found!"
            echo "Available directories:"
            find . -type d -maxdepth 2
            exit 1
          fi

      # Check if the file exists and render it
      - name: Render Syllabus to PDF
        run: |
          if [ -f "./syllabus/syllabus_wis2323.qmd" ]; then
            echo "Found syllabus_wis2323.qmd, rendering to PDF..."
            quarto render syllabus_wis2323.qmd --to pdf
          else
            echo "syllabus_wis2323.qmd not found in current directory"
            echo "Available .qmd files:"
            find . -name "*.qmd" -type f
            exit 1
          fi

      # Commit ONLY the syllabus PDF to main branch
      - name: Commit syllabus PDF to main branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add only the specific syllabus PDF file
          if [ -f "syllabus_wis2323.pdf" ]; then
            git add syllabus_wis2323.pdf
            
            # Check if there are changes to commit
            if git diff --staged --quiet; then
              echo "No changes to syllabus PDF"
            else
              git commit -m "Auto-update syllabus PDF [skip ci]"
              git push
              echo "Syllabus PDF committed and pushed to main branch"
            fi
          else
            echo "syllabus_wis2323.pdf not found - render may have failed"
          fi

      # Render the book project (if _quarto.yml exists)
      - name: Render Quarto Book Project  
        run: |
          if [ -f "_quarto.yml" ]; then
            echo "Found _quarto.yml, rendering book project..."
            quarto render
          else
            echo "No _quarto.yml found, skipping book render"
          fi

      # Upload syllabus PDF as artifact (backup)
      - name: Upload syllabus PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: syllabus-pdf
          path: "syllabus_wis2323.pdf"
        if: always()

      # Publish book to GitHub Pages (gh-pages branch)
      - name: Publish Book to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: hashFiles('_quarto.yml') != ''