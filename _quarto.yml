# bibliography: HerbVar.bib
csl: format/ecology.csl
format:
  html:
    title-block: false
    # title-block-banner: images/banner.png
    theme: 
      - cosmo
    filters: [format/remove_title.lua]
  # docx:
  #   toc: true
  #   number-sections: true
  #   highlight-style: github
  pdf:
    documentclass: scrbook
    classoption: ["oneside", "open=any"]
    # cover-image: images/cover.png
    filters: [format/remove_title.lua]
    pdf-standard: ua-2
    # header-includes: |
    #   # \titlehead{\includegraphics[height=7in]{images/cover.png}}
    toc: false
    toc-depth: 1
    toc-title: Sections
    lof: false
    lot: false
    titlepage: false
    title-block-banner: images/banner.png
    # Numbering
    number-sections: false
    # Fonts
    # fontfamily: libertinus
    mainfont: "DejaVu Sans"
    # sansfont: Verdana
    # monofont: Source Code Pro
    fontsize: 10pt
    microtypeoptions: ["final"]
    # Colors
    colorlinks: true
    # Layout
    geometry:
      # - margin=0.75in
      - bindingoffset=0.0in
      - left=24mm
      - top=24mm
      - bottom=24mm
      - right=24mm
      # - heightrounded
      # - footskip=0.475in
      # - showframe
    # pagestyle: plain
    # Rendering
    keep-tex: true
    # https://quarto.org/docs/journals/templates.html#template-partials
    # https://github.com/quarto-dev/quarto-cli/discussions/1941
    # https://tex.stackexchange.com/questions/209993/how-to-customize-my-titlepage/210280#210280
    # https://github.com/nmfs-opensci/quarto_titlepages_v1
    # https://nmfs-opensci.github.io/quarto_titlepages_v1/03-how-to-use.html
    # https://tex.stackexchange.com/questions/209993/how-to-customize-my-titlepage/210280#210280
    # https://nrennie.rbind.io/blog/pdf-quarto/making-pretty-pdf-quarto/
    # https://github.com/nrennie/PrettyPDF
    includes:
      in-header: 'format/gt_packages.sty'
      text: |
        \usepackage{caption}  
        \captionsetup[table]{labelformat=empty}
        \usepackage{float}
        \floatplacement{table}{H}
        \usepackage{xcolor}
        \usepackage{sectsty}
        \definecolor{customnavy}{RGB}{0, 0, 128}
        \definecolor{customcharcoal}{RGB}{54, 69, 79}
        \sectionfont{\color{customnavy}}
        \subsectionfont{\color{customnavy}}   
        \subsubsectionfont{\color{customcharcoal}}   
        \usepackage{amssymb}
        \usepackage{pifont}
        \usepackage{wasysym}
        \usepackage{fontawesome5}
        \usepackage{etoolbox}
        % Completely remove page breaks for chapters
        \makeatletter
        % Patch KOMA-Script chapter commands
        \renewcommand*{\chapterpagestyle}{plain}
        \patchcmd{\scr@startchapter}{\if@openright\cleardoublepage\else\clearpage\fi}{}{}{}
        \patchcmd{\@makechapterhead}{\vspace*{50\p@}}{}{}{}
        \patchcmd{\@makeschapterhead}{\vspace*{50\p@}}{}{}{}
        % Patch standard LaTeX chapter commands as backup
        \patchcmd{\chapter}{\if@openright\cleardoublepage\else\clearpage\fi}{}{}{}
        \patchcmd{\chapter}{\clearpage}{}{}{}
        % Redefine chapter entirely to remove page breaks
        \renewcommand\chapter{%
          \global\@topnum\z@
          \@afterindentfalse
          \secdef\@chapter\@schapter
        }
        \makeatother
        % Adjust spacing for continuous flow
        \usepackage{titlesec}
        \titleformat{\chapter}[block]
          {\normalfont\Large\bfseries\color{customnavy}}
          {}
          {0pt}
          {}
        \titlespacing*{\chapter}{0pt}{20pt}{10pt}
        \titleformat{\section}
          {\normalfont\large\bfseries\centering\color{customnavy}}
          {}
          {0pt}
          {}
        \titlespacing*{\section}{0pt}{12pt}{6pt}
        \titlespacing*{\subsection}{0pt}{6pt}{3pt}
        \titlespacing*{\subsubsection}{0pt}{3pt}{3pt}
        % Force no page breaks before chapters
        \let\cleardoublepage\relax
        \let\clearpage\relax
    # the previous three lines let a new chapter start on the same page as the ending chapter
    
      # - macros.tex
    # include-in-header: 
    #  - "format/PrettyPDF.tex"
    # include-before-body:
    #  - "format/pagestyle.tex
    #   - "format/_titlepage.tex" 
          
      
  epub:
      epub-cover-image: images/cover.png

# pdf-engine: xelatex
# see fpr engine-opt: https://stackoverflow.com/questions/74261557/quarto-rendering-pdf-running-xelatex-faster-in-rstudio    
editor: source

execute:
  # freeze: auto
  freeze: false